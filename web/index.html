<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VAG VPTDI</title>
<link rel="icon" href="icon0.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#14171c;--panel:#1b1f26;--panel2:#222730;--line:#2e343f;--text:#dfe4ea;--dim:#8b95a3;--acc:#f0a437;--acc2:#4fb3d9;--up:#3fbf7f;--down:#e5604d;--mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#1a1205;font-weight:600}
button.primary:hover:not(:disabled){background:#ffbe5a;border-color:#ffbe5a;color:#1a1205}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 14px 0 0;letter-spacing:.3px;font-weight:600}
header h1 b{color:var(--acc)}
header .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
header .grow{flex:1}
#fname{color:var(--text);font-family:var(--mono);font-size:11.5px;max-width:34vw;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 9px;white-space:normal;word-break:break-all;line-height:1.35}
#fname:empty{display:none}
#allcbL{display:flex;align-items:center;gap:5px;color:var(--text);font-size:12.5px;white-space:nowrap;cursor:pointer;user-select:none}
#allcbL input{cursor:pointer}
header{flex-wrap:wrap}
#banner{display:none;padding:8px 14px;background:#3a2c12;border-bottom:1px solid #6b4d16;color:#ffd58a;flex:none}
#banner.err{background:#3d1b18;border-color:#7a2f27;color:#ffb3a8}
#banner.ok{background:#15301f;border-color:#256b3f;color:#a6e8c0}
#banner button{float:right;padding:1px 8px;margin-left:10px}
main{flex:1;display:flex;min-height:0}
#empty{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
#drop{border:2px dashed var(--line);border-radius:10px;padding:44px 56px;max-width:720px;text-align:center;color:var(--dim)}
#drop.over,body.dragging #drop{border-color:var(--acc);color:var(--text)}
#drop h2{color:var(--text);font-weight:600;margin:0 0 10px;font-size:20px}
#drop p{margin:6px 0}
#drop .row{margin-top:22px;display:flex;gap:10px;justify-content:center}
#drop code{font-family:var(--mono);color:var(--acc2)}
aside{width:340px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.card{padding:10px 12px;border-bottom:1px solid var(--line)}
.card h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){font-family:var(--mono);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;border-radius:0;background:none;color:var(--dim);padding:8px 6px}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
#blocks{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#blocks button{flex:1 0 auto;white-space:nowrap;padding:8px 14px}
#blocks::-webkit-scrollbar{height:6px}#blocks::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.filter{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.filter input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);padding:5px 8px;font:inherit}
.filter label{color:var(--dim);white-space:nowrap;display:flex;gap:4px;align-items:center}
#list{flex:1;overflow:auto;min-height:0}
#list .grp{padding:6px 12px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);position:sticky;top:0;background:var(--panel)}
#list .it{display:flex;gap:8px;align-items:baseline;padding:4px 12px;cursor:pointer;border-left:3px solid transparent}
#list .it:hover{background:var(--panel2)}
#list .it.sel{background:#2a303b;border-left-color:var(--acc)}
#list .it .a{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
#list .it .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .it .d{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
#list .it.id .n{color:#fff;font-weight:600}
#list .it.flat .n{color:var(--dim)}
#list .it .chg{width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none;align-self:center}
#list .it .chg.no{background:none}
section{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.pane{flex:1;overflow:auto;padding:14px 18px;min-height:0;display:none}
.pane.on{display:block}
#mhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:10px}
#mhead h2{margin:0;font-size:18px;font-weight:600}
#mhead .sub{color:var(--dim);font-family:var(--mono);font-size:12px;margin-top:2px}
#mhead .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;color:var(--dim);padding:5px 10px}
.seg button.on{background:var(--panel2);color:var(--text)}
.note{color:var(--dim);margin:0 0 10px;max-width:900px}
.note.warn{color:#ffd58a}
table.map{border-collapse:collapse;font-family:var(--mono);font-size:12px}
table.map th,table.map td{padding:3px 7px;text-align:right;border:1px solid var(--bg);min-width:46px}
table.map th{background:var(--panel2);color:var(--acc2);font-weight:400;position:sticky}
table.map thead th{top:0}
table.map th.corner{color:var(--dim);font-size:11px;text-align:left}
table.map td.chg{outline:1px solid var(--acc);outline-offset:-1px}
#tunebar .tsep{width:1px;height:24px;background:var(--line);flex:none}
#maprow{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:4px}
#maprow #tablewrap{flex:0 1 auto;max-width:100%;overflow:auto;margin:0}
#vizwrap{flex:1 1 360px;min-width:300px;position:sticky;top:0}
#segViz{margin-bottom:8px}
#chart{width:100%;height:360px;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:block}
.legend{color:var(--dim);font-size:12px;margin-top:6px}
table.plain{border-collapse:collapse;width:100%;max-width:1000px}
table.plain th{text-align:left;color:var(--dim);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.8px;padding:6px 10px;border-bottom:1px solid var(--line)}
table.plain td{padding:5px 10px;border-bottom:1px solid var(--line)}
table.plain td.m{font-family:var(--mono);font-size:12px}
table.plain tr.click{cursor:pointer}
table.plain tr.click:hover{background:var(--panel)}
h4{margin:20px 0 6px;font-size:14px}
h4:first-child{margin-top:0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0d0f12;border:1px solid var(--line);padding:9px 16px;border-radius:6px;display:none;max-width:80vw;box-shadow:0 6px 24px #0008}
#ckbar{display:none;align-items:center;gap:12px;padding:6px 14px;font-size:12.5px;flex:none;border-bottom:1px solid var(--line)}
#ckbar.ok{background:#15301f;border-color:#256b3f;color:#a6e8c0}
#ckbar.bad{background:#3a2c12;border-color:#6b4d16;color:#ffd58a}
#ckbar.na{background:var(--panel);color:var(--dim)}
#ckbar b{font-weight:600}
#ckbar .dot{width:9px;height:9px;border-radius:50%;flex:none}
#ckbar.ok .dot{background:var(--up)}#ckbar.bad .dot{background:var(--acc)}#ckbar.na .dot{background:var(--dim)}
#ckbar .mono{font-family:var(--mono);font-size:12px;opacity:.85}
#ckbar button{margin-left:auto;padding:3px 10px;font-size:12px}
#tunebar{display:none;align-items:center;gap:14px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#tunebar .tgrp{display:flex;align-items:center;gap:6px}
#tunebar label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
#tunebar input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);padding:4px 6px;font:inherit;text-align:right}
#tunebar .u{color:var(--dim);font-size:12px}
#tunebar button{padding:4px 10px;font-size:12px}
#tunebar .tnote{margin-left:auto;color:var(--dim);font-size:11.5px}
#tunebar input[type=number]{-moz-appearance:textfield;appearance:textfield}
#tunebar input::-webkit-outer-spin-button,#tunebar input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.map td.msel{outline:2px solid var(--acc2);outline-offset:-2px;box-shadow:inset 0 0 0 100px rgba(79,179,217,.16)}
table.map td.hl,table.map th.hl{outline:2px solid #fff;outline-offset:-2px;box-shadow:inset 0 0 0 100px rgba(255,255,255,.14)}
#vizwrap canvas{cursor:crosshair}
table.map th.axh{cursor:cell}
table.map th.axh:hover{color:#fff;outline:1px solid var(--acc2);outline-offset:-1px}
#segEdit{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:3px 6px}
#segEdit input{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:3px;color:var(--text);padding:3px 6px;font:inherit;text-align:right}
#segEdit button{padding:3px 10px;font-size:12px;background:var(--panel2)}
#selcount{color:var(--dim);font-size:12px;margin-left:2px;white-space:nowrap}
table.map td.ed{cursor:cell}
table.map td.ed:hover{outline:1px solid var(--acc2);outline-offset:-1px}
table.map td.dirty{color:var(--acc);font-weight:600}
table.map td input{display:block;width:100%;min-width:0;max-width:100%;background:#0d0f12;color:#fff;border:1px solid var(--acc);border-radius:2px;font:inherit;text-align:right;padding:1px 3px}
table.map td.editing,table.map th.editing{position:relative;overflow:visible;z-index:10}
table.map td.editing input,table.map th.editing input{position:absolute;right:0;top:1px;width:76px!important;min-width:76px!important;max-width:76px!important;z-index:20}

/* Modern, compact controls and consistent scrollbars. */
*{scrollbar-width:thin;scrollbar-color:#46505e transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#46505e;border:2px solid transparent;background-clip:padding-box;border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:#687687;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-corner{background:transparent}
button{border-radius:7px;transition:background .15s,border-color .15s,color .15s,transform .1s}
button:hover:not(:disabled){background:#2b333e}
button:active:not(:disabled){transform:translateY(1px)}
button.primary{box-shadow:0 2px 10px #f0a43722}
header{padding:10px 16px;gap:9px;background:linear-gradient(180deg,#20252d,#1b1f26)}
header h1{font-size:16px;letter-spacing:.5px}
header .sep{height:26px}
#fname{box-shadow:inset 0 1px 4px #0005}
#tunebar{padding:8px 16px;gap:10px;background:#181c22;box-shadow:0 2px 10px #0003}
#tunebar .tgrp{padding:3px 7px;border:1px solid #303844;border-radius:7px;background:#20252d}
#tunebar button{border-radius:5px;padding:4px 11px}
#tunebar input,#segEdit input,.filter input[type=text]{border-radius:6px;box-shadow:inset 0 1px 4px #0005}
#allcbL{margin-left:3px;padding:4px 6px;border-radius:6px;background:#20252d;font-size:11px;gap:3px}
#allcbL input{margin:0 2px 0 0}
#ckbar{padding:8px 16px}
#banner{padding:9px 16px}
aside{width:350px;background:linear-gradient(90deg,#1b1f26,#191d23)}
.card{padding:13px 15px;background:#1d222a}
.card h3{margin-bottom:8px}
.tabs button{padding:10px 8px}
#blocks{padding:4px 7px;background:#171b21}
#blocks button{border-radius:6px;padding:7px 12px}
.filter{padding:10px 12px;background:#1b1f26}
#list .grp{padding:9px 14px 4px;background:#1b1f26}
#list button.grp{display:block;width:100%;border:0;border-radius:0;padding:9px 14px 5px;text-align:left;background:#1b1f26;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
#list button.grp:hover{background:#252c36;color:var(--text)}
#list .it{padding:7px 14px;border-left-width:3px}
#list .it.sel{background:linear-gradient(90deg,#303946,#252b34)}
#list .it:hover{background:#272e38}
section{background:#14171c}
#views{margin:0 14px;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:#1a1e25;overflow:hidden}
#views button{padding:10px 14px}
.pane{padding:20px 24px}
#mhead{padding-bottom:12px;border-bottom:1px solid #292f39}
#mhead h2{font-size:19px}
#maprow{gap:22px}
#vizwrap{background:#191e25;border:1px solid #2a313b;border-radius:9px;padding:10px;box-shadow:0 8px 24px #0002}
#chart{height:380px;border:0;background:#15191f;border-radius:6px}
table.map{border-spacing:0;border-collapse:separate;overflow:hidden;border:1px solid #333b47;border-radius:8px;box-shadow:0 8px 24px #0003}
table.map th,table.map td{border-color:#252b34;padding:4px 8px}
table.map th{background:#252c36}
table.map td{background:#1b2027}
table.map tr:nth-child(even) td{background:#1e242c}
table.map td.ed:hover{background:#2a333e}
table.plain{border:1px solid #303743;border-radius:8px;overflow:hidden}
table.plain th{background:#222831;padding:9px 11px}
table.plain td{padding:8px 11px}
#toast{bottom:24px;border-radius:9px;box-shadow:0 10px 30px #0008;padding:10px 17px}
@media (max-width:900px){aside{width:290px}.pane{padding:16px}#vizwrap{min-width:260px}header h1{margin-right:4px}#fname{max-width:28vw}}
@media (max-width:680px){main{display:block;overflow:auto}aside{width:100%;height:38vh;border-right:0;border-bottom:1px solid var(--line)}section{height:62vh}header{padding:8px 10px}.pane{padding:14px 12px}#views{margin:0 8px}.tsep{display:none}#tunebar{gap:6px;padding:6px 8px}.card{padding:9px 12px}}
</style>
</head>
<body>
<header>
  <h1><b>VAG VPTDI</b></h1>
  <button id="bOpen" class="primary" title="Open one combined .bin, or the LLL and HHH chip files together">Open bin / LLL + HHH…</button>
  <button id="bCmp" disabled title="Load a second file (e.g. the original) to see what was changed">Compare with…</button>
  <span class="sep"></span>
  <button id="bSaveBin" disabled title="Save the edited BIN file (checksums corrected automatically)">Save .bin</button>
  <button id="bSaveChips" disabled title="Split into the two chip files for the programmer (checksums corrected automatically)">Save LLL + HHH</button>
  <button id="bFix" disabled title="Recalculate and write the block checksums now">Correct checksums</button>
  <span class="grow"></span>
  <span id="fname"></span>
</header>
<div id="tunebar">
  <span class="tgrp"><label>Max IQ</label><input id="tIQ" type="number" min="0" max="255" step="1" autocomplete="off"><span class="u">mg</span><button id="tIQset">Set</button></span>
  <span class="tsep"></span>
  <span class="tgrp"><label>Hard-cut</label><input id="tRPM" type="number" min="0" max="7000" step="10" autocomplete="off"><span class="u">rpm</span><button id="tRPMset">Set</button></span>
  <span class="tsep"></span>
  <button id="tEGR" title="Set the EGR map (requested air mass) to 850">EGR off</button>
  <span class="tsep"></span>
  <button id="t3bar" title="Set the MAP-sensor factor and pressure configuration for a 3 bar sensor">3-bar mod</button>
  <button id="tAuto" class="primary" title="Apply the map changes learned from the loaded Stage 1 reference">Auto Stage 1</button>
  <label id="allcbL" title="Scope of the Max IQ / Hard-cut / EGR off / 3-bar buttons. On: every code block. Off: only the selected code block."><input type="checkbox" id="allCB" checked>All code blocks</label>
</div>
<div id="ckbar"></div>
<div id="banner"></div>
<main>
  <div id="empty">
    <div id="drop">
      <h2>Open a VAG TDI dump</h2>
      <p>Drop files here or use the button.</p>
      <p><b>One file</b> = combined 256 KB bin &nbsp;·&nbsp; <b>two files</b> = the <code>LLL</code> and <code>HHH</code> chip dumps, merged automatically.</p>
      <p>It does not matter which chip you pick first - the order is detected from the data.</p>
      <div class="row"><button id="bOpen2" class="primary">Open bin / LLL + HHH…</button></div>
    </div>
  </div>
  <aside id="side" style="display:none">
    <div class="card"><h3>ECU</h3><div class="kv" id="ecu"></div></div>
    <div class="tabs" id="blocks"></div>
    <div class="filter"><input type="text" id="q" placeholder="Filter maps (name, address, size)…" autocomplete="off"><label id="chgWrap" style="display:none"><input type="checkbox" id="onlyChg">changed</label></div>
    <div id="list"></div>
  </aside>
  <section id="work" style="display:none">
    <div class="tabs" id="views" style="max-width:680px">
      <button data-v="map" class="on">Map</button><button data-v="consts">Constants</button><button data-v="changes">Changes</button><button data-v="chips">Chips &amp; checksums</button>
    </div>
    <div class="pane on" id="p-map">
      <div id="mhead"></div><p class="note" id="mnote"></p>
      <div id="maprow">
        <div id="tablewrap"></div>
        <div id="vizwrap">
          <span class="seg" id="segViz"><button data-z="2d" class="on">2D</button><button data-z="3d">3D</button></span>
          <canvas id="chart"></canvas>
          <div class="legend" id="legend"></div>
        </div>
      </div>
    </div>
    <div class="pane" id="p-consts"></div>
    <div class="pane" id="p-changes"></div>
    <div class="pane" id="p-chips"></div>
  </section>
</main>
<input type="file" id="fOpen" multiple hidden>
<input type="file" id="fCmp" multiple hidden>
<input type="file" id="fPack" accept=".txt,.csv,text/plain" hidden>
<div id="toast"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
